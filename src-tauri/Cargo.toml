[package]
name = "tts-desktop"
version = "0.1.0"
description = "TTS 图包制作维护工作台（Tauri 壳）"
authors = ["Smirk1921"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tts_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# v9-3 首次向导：前端经 plugin-fs 检测/写入「首次向导.flag」（appConfigDir）
tauri-plugin-fs = "2"
# v9-3 首次向导 B1：'example' 分支经 plugin-dialog 让用户选示例图包解开目录（save-dialog）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v9-2 sidecar：Child 非 Send，用 Lazy<Mutex<Option<Child>>> 管理 hub 进程
once_cell = "1.19"
# v9-2 sidecar：GET /v1/status 检查外置 hub 版本（0.12 配套 tokio 1，勿降 0.11）
reqwest = { version = "0.12", features = ["json"] }
# v9-2 sidecar：reqwest 运行时；tauri 内部也用 tokio，"full" 重复但无害
tokio = { version = "1", features = ["full"] }

# UI-1a WebView2 检测：读注册表
[target.'cfg(windows)'.dependencies]
winreg = "0.52"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
